[program:aryacakra-api]
directory=/home/aryacakra/sites/aryacakra-api/aryacakra
command=/home/aryacakra/sites/aryacakra-api/env/bin/python -m gunicorn core.wsgi:application --bind 0.0.0.0:8300 --workers 1 --threads 3 --timeout 60 --graceful-timeout 30 --preload --error-logfile '-' --access-logfile '-'
stopasgroup=true
autostart=true
autorestart=true
killasgroup=true
user=aryacakra
group=aryacakra
stderr_logfile=/var/log/supervisor/aryacakra-api.err.log
stdout_logfile=/var/log/supervisor/aryacakra-api.out.log
environment=PYTHONPATH="services",DJANGO_SETTINGS_MODULE="core.settings"

